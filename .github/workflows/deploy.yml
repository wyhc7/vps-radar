name: Deploy to Cloudflare

# 手动触发：GitHub 网页 → Actions → Deploy to Cloudflare → Run workflow
on:
  workflow_dispatch:

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm install -g wrangler

      # D1 建过会报错，忽略错误后从列表取回真实 database_id 写回 wrangler.toml
      - name: Create D1 database (idempotent)
        run: |
          npx wrangler d1 create vps-radar || true
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="vps-radar") | .uuid' | head -n1)
          if [ -z "$DB_ID" ]; then echo "::error::获取 D1 database_id 失败"; exit 1; fi
          sed -i "s|database_id = .*|database_id = \"$DB_ID\"|" wrangler.toml
          echo "database_id = $DB_ID"

      - name: Init schema (idempotent)
        run: npx wrangler d1 execute vps-radar --remote --file=schema.sql -y

      - name: Set ADMIN_TOKEN secret
        run: echo -n "${{ secrets.ADMIN_TOKEN }}" | npx wrangler secret put ADMIN_TOKEN

      # 可选：配置了这两个 Secrets 才启用 Telegram 预警
      - name: Set Telegram secrets (optional)
        if: ${{ env.TG_BOT_TOKEN != '' && env.TG_CHAT_ID != '' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          echo -n "$TG_BOT_TOKEN" | npx wrangler secret put TG_BOT_TOKEN
          echo -n "$TG_CHAT_ID" | npx wrangler secret put TG_CHAT_ID

      # 可选：配置了 BARK_KEY 才启用 Bark（iOS）预警
      - name: Set Bark secret (optional)
        if: ${{ env.BARK_KEY != '' }}
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: echo -n "$BARK_KEY" | npx wrangler secret put BARK_KEY

      - name: Deploy worker
        run: npx wrangler deploy

      - name: Show dashboard URL
        run: |
          echo "==== 部署完成 ===="
          echo "仪表盘地址见上方 Deploy worker 步骤日志中的 workers.dev 链接"
          echo "打开后点右上角「+ 添加服务器」，把给出的一键命令贴到你的 VPS 执行即可"
